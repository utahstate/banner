#####         #####
### Deployments ###
#####         #####
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    banner.usu.edu/application: zdevl.ssb-registration
    banner.usu.edu/environment: zdevl
  name: ssb-registration
  namespace: zdevl
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      banner.usu.edu/application: zdevl.ssb-registration
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        banner.usu.edu/application: zdevl.ssb-registration
        banner.usu.edu/environment: zdevl
      namespace: zdevl
    spec:
      containers:
        - name: app
          image: usuit/banner9-ssb-registration:9.40.1-zdevl
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /StudentRegistrationSsb/actuator/health
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          ports:
            - containerPort: 8080
              name: 8080tcp
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /StudentRegistrationSsb/actuator/health
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          startupProbe:
            failureThreshold: 18
            httpGet:
              path: /StudentRegistrationSsb/actuator/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: >-
                /usr/local/tomcat/webapps/StudentRegistrationSsb/WEB-INF/classes/banner_configuration.groovy
              name: groovy
              readOnly: true
              subPath: banner_configuration.groovy
            - mountPath: >-
                /usr/local/tomcat/webapps/StudentRegistrationSsb/WEB-INF/classes/StudentRegistrationSsb_configuration.groovy
              name: groovy
              readOnly: true
              subPath: StudentRegistrationSsb_configuration.groovy
            - mountPath: /saml/metadata
              name: saml-metadata
              readOnly: true
            - mountPath: /run/passwords
              name: db-passwords
              readOnly: true
            - mountPath: /saml/keystore
              name: saml-keystore
              readOnly: true
            - mountPath: /run/app-config/properties.d
              name: properties
              readOnly: true
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: dockerhub-usuitesutility-ro
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: app-configuration
            optional: false
          name: groovy
        - configMap:
            defaultMode: 420
            name: saml-ssb-registration
            optional: false
          name: saml-metadata
        - name: db-passwords
          secret:
            defaultMode: 420
            optional: false
            secretName: db-passwords
        - name: saml-keystore
          secret:
            defaultMode: 420
            optional: false
            secretName: saml-keystore
        - configMap:
            defaultMode: 420
            name: properties
            optional: false
          name: properties
---
