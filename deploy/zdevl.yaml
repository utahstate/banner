apiVersion: apps/v1
kind: Deployment
metadata:
  name: ellucian-messaging-service
  namespace: zdevl
  labels:
    banner.usu.edu/application: zdevl.ellucian-messaging-service
    banner.usu.edu/environment: zdevl
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      banner.usu.edu/application: zdevl.ellucian-messaging-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      namespace: zdevl
      labels:
        banner.usu.edu/application: zdevl.ellucian-messaging-service
        banner.usu.edu/environment: zdevl
    spec:
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      volumes:
        - name: rabbitmq
          persistentVolumeClaim:
            claimName: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          imagePullPolicy: Always
          ports:
            - containerPort: 5672
              name: 5672tcp
              protocol: TCP
            - containerPort: 15672
              name: 15672tcp
              protocol: TCP
            - containerPort: 15692
              name: 15692tcp
              protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/rabbitmq
              name: rabbitmq
          env:
            - name: RABBITMQ_DEFAULT_PASS
              value: rabbit
            - name: RABBITMQ_DEFAULT_USER
              value: ellucian
            - name: RABBITMQ_DEFAULT_VHOST
              value: EllucianMessaging
            - name: RABBITMQ_FEATURE_FLAGS
              value: all
