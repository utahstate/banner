apiVersion: apps/v1
kind: Deployment
metadata:
  name: extensibility
  namespace: zdevl
  labels:
    banner.usu.edu/application: zdevl.extensibility
    banner.usu.edu/environment: zdevl
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      banner.usu.edu/application: zdevl.extensibility
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      namespace: zdevl
      labels:
        banner.usu.edu/application: zdevl.extensibility
        banner.usu.edu/environment: zdevl
    spec:
      imagePullSecrets:
        - name: dockerhub-usuitesutility-ro
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      volumes:
        - name: groovy
          configMap:
            defaultMode: 420
            name: groovy-configs
            optional: false
        - name: saml-metadata
          configMap:
            defaultMode: 420
            name: saml-extensibility
            optional: false
        - name: db-passwords
          secret:
            defaultMode: 420
            secretName: db-passwords
            optional: false
        - name: saml-keystore
          secret:
            defaultMode: 420
            secretName: saml-keystore
            optional: false
        - name: properties
          configMap:
            defaultMode: 420
            name: properties
            optional: false
        - name: extensibility
          persistentVolumeClaim:
            claimName: extensibility
      containers:
        - name: app
          image: usuit/banner9-extensibility:9.25.1-zdevl
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: 8080tcp
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /BannerExtensibility/actuator/health
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 6
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /BannerExtensibility/actuator/health
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /BannerExtensibility/actuator/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 18
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: >-
                /usr/local/tomcat/webapps/BannerExtensibility/WEB-INF/classes/banner_configuration.groovy
              name: groovy
              readOnly: true
              subPath: banner_configuration.groovy
            - mountPath: >-
                /usr/local/tomcat/webapps/BannerExtensibility/WEB-INF/classes/BannerExtensibility_configuration.groovy
              name: groovy
              readOnly: true
              subPath: BannerExtensibility_configuration.groovy
            - mountPath: /saml/metadata
              name: saml-metadata
              readOnly: true
            - mountPath: /run/passwords
              name: db-passwords
              readOnly: true
            - mountPath: /saml/keystore
              name: saml-keystore
              readOnly: true
            - mountPath: /run/app-config/properties.d
              name: properties
              readOnly: true
            - mountPath: /opt/banner/extensibility
              name: extensibility
              readOnly: false
