#####     #####
### Ingress ###
#####     #####
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: self-service
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ss-zdevl.banner.usu.edu
      secretName: banner-usu-edu-tls
  rules:
    - host: "ss-zdevl.banner.usu.edu"
      http:
        paths:
          - pathType: Prefix
            path: "/StudentRegistrationSsb"
            backend:
              service:
                name: ssb-registration
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerGeneralSsb"
            backend:
              service:
                name: ssb-general
                port:
                  number: 80
          - pathType: Prefix
            path: "/StudentSelfService"
            backend:
              service:
                name: ss-student
                port:
                  number: 80
          - pathType: Prefix
            path: "/FinanceSelfService"
            backend:
              service:
                name: ss-finance
                port:
                  number: 80
          - pathType: Prefix
            path: "/FacultySelfService"
            backend:
              service:
                name: ss-faculty
                port:
                  number: 80
          - pathType: Prefix
            path: "/EmployeeSelfService"
            backend:
              service:
                name: ss-employee
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerExtensibility"
            backend:
              service:
                name: extensibility
                port:
                  number: 80
