#####                  #####
### Simple Configuration ###
#####                  #####
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    banner.usu.edu/environment: zdevl
  name: properties
  namespace: zdevl
data:
  10-common.properties: |
    bannerdb.jdbc=jdbc:oracle:thin:@//zdevl.db.usu.edu:1521/zdevl
    banproxy.username=banproxy
    banproxy.initialsize=25
    banproxy.maxtotal=400
    banproxy.maxidle=-1
    banproxy.maxwait=30000
    banssuser.username=ban_ss_user
    banssuser.initialsize=25
    banssuser.maxtotal=400
    banssuser.maxidle=-1
    banssuser.maxwait=30000
    banner9.baseurl=https://ss-zdevl.banner.usu.edu
    remove.abandoned.on.maintenance=true
    remove.abandoned.on.borrow=true
    remove.abandoned.timeout=2100
    remove.ss.abandoned.timeout=60
    log.abandoned=true
    bannerdb.rowPrefetch=150
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-publisher-properties
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
data:
  50-events.properties: |
    events.username=events
    events.initialsize=25
    events.maxtotal=300
    events.maxidle=-1
    events.maxwait=30000
  50-cdcadmin.properties: |
    cdcadmin.username=cdcadmin
    cdcadmin.initialsize=25
    cdcadmin.maxtotal=300
    cdcadmin.maxidle=-1
    cdcadmin.maxwait=30000

#####                #####
### Persistent Volumes ###
#####                #####
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: id-photos
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
spec:
  accessModes:
    - ReadOnlyMany
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    path: /nfs/bannerdev/photos
    server: 129.123.109.82
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: id-photos
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  volumeMode: Filesystem
  volumeName: id-photos
---
