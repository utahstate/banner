####     ####
## INGRESS ##
####     ####
# Note: I've broken these up along the same lines as the production lb/lb-api/lb-priv/tn split. The ingress-level ACLs should correspond to the firewall rules applied to those load balancers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: self-service
  namespace: zdevl
  annotations:
    traefik.ingress.kuberentes.io/router.middlewares: >-
      zdevl-hardening@kubernetescrd,zdevl-acl-onprem@kubernetescrd,zdevl-maintenance-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ss-zdevl.banner.usu.edu
      secretName: selfservice-https
  rules:
    - host: "ss-zdevl.banner.usu.edu"
      http:
        paths:
          - pathType: Prefix
            path: "/StudentRegistrationSsb"
            backend:
              service:
                name: ssb-registration
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerGeneralSsb"
            backend:
              service:
                name: ssb-general
                port:
                  number: 80
          - pathType: Prefix
            path: "/StudentSelfService"
            backend:
              service:
                name: ss-student
                port:
                  number: 80
          - pathType: Prefix
            path: "/FinanceSelfService"
            backend:
              service:
                name: ss-finance
                port:
                  number: 80
          - pathType: Prefix
            path: "/FacultySelfService"
            backend:
              service:
                name: ss-faculty
                port:
                  number: 80
          - pathType: Prefix
            path: "/EmployeeSelfService"
            backend:
              service:
                name: ss-employee
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerExtensibility"
            backend:
              service:
                name: extensibility
                port:
                  number: 80
          - pathType: Prefix
            path: "/CommunicationManagement"
            backend:
              service:
                name: communicationmanagement
                port:
                  number: 80
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: static
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: zdevl
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      zdevl-hardening@kubernetescrd,zdevl-acl-api@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api-zdevl.banner.usu.edu
      secretName: api-https
  rules:
    - host: "api-zdevl.banner.usu.edu"
      http:
        paths:
          - pathType: Prefix
            path: "/DocumentManagementApi"
            backend:
              service:
                name: api-documentmanagement
                port:
                  number: 80
          - pathType: Prefix
            path: "/IntegrationApi"
            backend:
              service:
                name: api-integration
                port:
                  number: 80
          - pathType: Prefix
            path: "/StudentApi"
            backend:
              service:
                name: api-student
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerAdminBPAPI"
            backend:
              service:
                name: bpapi
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: zdevl
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      zdevl-hardening@kubernetescrd,zdevl-acl-onprem@kubernetescrd,zdevl-maintenance-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - admin-zdevl.banner.usu.edu
      secretName: admin-https
    - hosts:
        - brimdev.banner.usu.edu
      secretName: brim-https
    - hosts:
        - bepdev.banner.usu.edu
      secretName: eventpublisher-https
  rules:
    - host: "admin-zdevl.banner.usu.edu"
      http:
        paths:
          - pathType: Prefix
            path: "/applicationNavigator"
            backend:
              service:
                name: application-navigator
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerAdmin"
            backend:
              service:
                name: admin
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerAdmin.ws"
            backend:
              service:
                name: admin
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerAccessMgmt"
            backend:
              service:
                name: admin
                port:
                  number: 80
          - pathType: Prefix
            path: "/BannerAccessMgmt.ws"
            backend:
              service:
                name: admin
                port:
                  number: 80
          - pathType: Prefix
            path: "/eTranscriptAPI"
            backend:
              service:
                name: api-etranscript
                port:
                  number: 80
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: static
                port:
                  number: 80
    - host: "brimdev.banner.usu.edu"
      http:
        paths:
          - pathType: Prefix
            path: "/brim"
            backend:
              service:
                name: brim
                port:
                  number: 80
          - pathType: Prefix
            path: "/"
            backend:
