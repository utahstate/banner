apiVersion: apps/v1
kind: Deployment
metadata:
  name: communicationmanagement
  namespace: zdevl
  labels:
    banner.usu.edu/application: zdevl.communicationmanagement
    banner.usu.edu/environment: zdevl
  annotations:
    banner.usu.edu/desired-replicas: '1'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      banner.usu.edu/application: zdevl.communicationmanagement
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      namespace: zdevl
      labels:
        banner.usu.edu/application: zdevl.communicationmanagement
        banner.usu.edu/environment: zdevl
    spec:
      imagePullSecrets:
        - name: dockerhub-usuitesutility-ro
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      volumes:
        - name: groovy
          configMap:
            defaultMode: 420
            name: groovy-configs
        - name: saml-metadata
          configMap:
            defaultMode: 420
            name: saml-communicationmanagement
        - name: banssuser-creds
          secret:
            defaultMode: 420
            secretName: banssuser-creds
        - name: banproxy-creds
          secret:
            defaultMode: 420
            secretName: banproxy-creds
        - name: commmgr-creds
          secret:
            defaultMode: 420
            secretName: commmgr-creds
        - name: saml-keystore
          secret:
            defaultMode: 420
            secretName: saml-keystore
        - name: properties
          configMap:
            defaultMode: 420
            name: properties
      containers:
        - name: app
          image: usuit/banner9-communicationmanagement:9.23.2-zdevl
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: tomcat
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /CommunicationManagement/actuator/health
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 6
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /CommunicationManagement/actuator/health
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 1
          startupProbe:
            httpGet:
              path: /CommunicationManagement/actuator/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 18
            timeoutSeconds: 1
          resources:
            requests:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: 'no'
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: 'no'
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /run/app-config/groovy
              name: groovy
              readOnly: true
            - mountPath: /saml/metadata
              name: saml-metadata
              readOnly: true
            - mountPath: /run/passwords/db-banssuser
              name: banssuser-creds
              readOnly: true
            - mountPath: /run/passwords/db-banproxy
              name: banproxy-creds
              readOnly: true
            - mountPath: /run/passwords/db-commmgr
              name: commmgr-creds
              readOnly: true
            - mountPath: /saml/keystore
              name: saml-keystore
              readOnly: true
            - mountPath: /run/app-config/properties.d
              name: properties
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: communicationmanagement
  namespace: zdevl
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: 'true'
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: communicationmanagement-sticky
    banner.usu.edu/routing.commonHost: self-service
    banner.usu.edu/routing.pathPrefix: "/CommunicationManagement"
  labels:
    banner.usu.edu/application: zdevl.communicationmanagement
    banner.usu.edu/environment: zdevl
spec:
  selector:
    banner.usu.edu/application: zdevl.communicationmanagement
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
