apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpapi
  namespace: zdevl
  labels:
    banner.usu.edu/application: zdevl.bpapi
    banner.usu.edu/environment: zdevl
  annotations:
    banner.usu.edu/desired-replicas: '1'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      banner.usu.edu/application: zdevl.bpapi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      namespace: zdevl
      labels:
        banner.usu.edu/application: zdevl.bpapi
        banner.usu.edu/environment: zdevl
    spec:
      imagePullSecrets:
        - name: dockerhub-usuitesutility-ro
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      volumes:
        - name: groovy
          configMap:
            defaultMode: 420
            name: groovy-configs
        - name: banproxy-creds
          secret:
            defaultMode: 420
            secretName: banproxy-creds
        - name: properties
          configMap:
            defaultMode: 420
            name: properties
      containers:
        - name: app
          image: usuit/banner9-bpapi:javaforms-93-zdevl
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: tomcat
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 6
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 2
            successThreshold: 1
            periodSeconds: 10
            timeoutSeconds: 1
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 18
            successThreshold: 1
            periodSeconds: 10
            initialDelaySeconds: 60
          resources:
            requests:
              memory: 8Gi
          env:
            - name: XMS
              value: '8g'
            - name: XMX
              value: '8g'
          securityContext:
            allowPrivilegeEscalation: no
            privileged: no
            readOnlyRootFilesystem: no
            runAsNonRoot: no
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /run/app-config/groovy
              name: groovy
              readOnly: true
            - mountPath: /run/passwords/db-banproxy
              name: banproxy-creds
              readOnly: true
            - mountPath: /run/app-config/properties.d
              name: properties
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: bpapi
  namespace: zdevl
  labels:
    banner.usu.edu/application: zdevl.bpapi
    banner.uus.edu/environment: zdevl
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: 'true'
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: bpapi-sticky
    banner.usu.edu/routing.commonHost: api
    banner.usu.edu/routing.pathPrefix: "/BannerAdminBPAPI"
spec:
  selector:
    banner.usu.edu/application: zdevl.bpapi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
