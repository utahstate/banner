apiVersion: apps/v1
kind: Deployment
metadata:
  name: static
  namespace: zdevl
  labels:
    banner.usu.edu/application: zdevl.static
    banner.usu.edu/environment: zdevl
  annotations:
    banner.usu.edu/autoscale.skip: 'true'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      banner.usu.edu/application: zdevl.static
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      namespace: zdevl
      labels:
        banner.usu.edu/application: zdevl.static
        banner.usu.edu/environment: zdevl
    spec:
      imagePullSecrets:
        - name: dockerhub-usuitesutility-ro
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      containers:
        - name: nginx
          # Use zpprd for all non-prod environments
          image: usuit/banner-static:zpprd
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: nginx
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 6
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: no
            privileged: no
            readOnlyRootFilesystem: no
            runAsNonRoot: no
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
---
apiVersion: v1
kind: Service
metadata:
  name: static
  namespace: zdevl
  labels:
    banner.usu.edu/application: zdevl.static
    banner.usu.edu/environment: zdevl
spec:
  selector:
    banner.usu.edu/application: zdevl.static
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
