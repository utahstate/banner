  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
    banner.usu.edu/application: zdevl.ellucian-messaging-service
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Gi
  nfs:
    path: /nfs/bannerdev/zdevl/rabbit
    server: 129.123.109.82
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
    banner.usu.edu/application: zdevl.ellucian-messaging-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
