####           ####
## CONFIGURATION ##
####           ####
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    banner.usu.edu/environment: zdevl
  name: properties
  namespace: zdevl
data:
  10-common.properties: |
    bannerdb.jdbc=jdbc:oracle:thin:@//db.zdevl.svc.bannerdev.k8s.usu.edu:1521/zdevl
    banner9.baseurl=https://ss-zdevl.banner.usu.edu
    remove.abandoned.on.maintenance=true
    remove.abandoned.on.borrow=true
    remove.abandoned.timeout=2100
    remove.ss.abandoned.timeout=60
    log.abandoned=true
    bannerdb.rowPrefetch=150
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zdevl-cicd
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
    banner.usu.edu/application: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zdevl-cicd
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
    banner.usu.edu/application: cicd
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zdevl-cicd
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
    banner.usu.edu/application: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  name: zdevl-cicd
  kind: Role
subjects:
  - apiGroup: ''
    kind: ServiceAccount
    name: zdevl-cicd
    namespace: zdevl
---
apiVersion: v1
kind: Secret
metadata:
  name: zdevl-cicd
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
    banner.usu.edu/application: cicd
  annotations:
    kubernetes.io/service-account.name: zdevl-cicd
type: kubernetes.io/service-account-token
---
####                ####
## PERSISTENT STORAGE ##
####                ####

###       ###
# ID Photos #
###       ###
apiVersion: v1
kind: PersistentVolume
metadata:
  name: id-photos
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
spec:
  accessModes:
    - ReadOnlyMany
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    path: /nfs/bannerdev/photos
    server: 129.123.109.82
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: id-photos
  namespace: zdevl
  labels:
    banner.usu.edu/environment: zdevl
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  volumeMode: Filesystem
  volumeName: id-photos
---
